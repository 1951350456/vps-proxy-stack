name: Verify clean deployment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n deploy.sh tests/smoke.sh
      - run: python3 scripts/audit_public.py
      - run: docker compose -p vps-proxy-stack config --quiet
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: sudo bash tests/smoke.sh
      - name: Service status on failure
        if: failure()
        run: sudo docker compose -p vps-proxy-stack ps
