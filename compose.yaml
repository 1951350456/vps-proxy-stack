services:
  panel:
    image: ghcr.io/mhsanaei/3x-ui:v3.10.2
    network_mode: host
    restart: unless-stopped
    environment:
      XUI_ENABLE_FAIL2BAN: "false"
      TZ: UTC
    volumes:
      - ./data/db:/etc/x-ui
      - ./data/xray-logs:/var/log/xray
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    network_mode: host
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./data/conversions:/data
    logging: *logging
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    image: nginx:1.28-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/cert:/cert:ro
    logging: *logging

  acme:
    image: neilpang/acme.sh:3.1.6
    profiles: [tools]
    network_mode: host
    entrypoint: [/acmebin/acme.sh]
    volumes:
      - ./data/acme:/acme.sh
      - ./data/cert:/cert
    logging: *logging
